<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto - CinePlus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navigation-bar"></div>

  <div class="container py-5">
    <h2 class="mb-4">Contáctanos</h2>
    <form id="form-contacto" novalidate>
      <div class="mb-3">
        <label for="nombre" class="form-label required">Nombre</label>
        <input type="text" class="form-control" id="nombre" required>
        <div class="invalid-feedback">Nombre requerido.</div>
      </div>
      <div class="mb-3">
        <label for="correo" class="form-label required">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" placeholder="francisco@email.com" required>
        <div class="invalid-feedback">Correo no válido.</div>
      </div>
      <div class="mb-3">
        <label for="mensaje" class="form-label required">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="4" required minlength="20" maxlength="50"></textarea>
        <div class="invalid-feedback">El mensaje debe tener entre 20 y 50 caracteres</div>
      </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
      <div id="alerta" class="alert alert-success mt-3 d-none">Mensaje enviado con éxito.</div>
    </form>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="../js/utils.js"></script>

  <script>
    $("#navigation-bar").load("navBar.html", function(){
      getRutasBarraNavegacion(window.location.pathname);
    });
    $("#footer-placeholder").load("footer.html");

    $(function () {
      const form = document.getElementById("form-contacto");
      const $inputs = $("#form-contacto input, #form-contacto textarea");
      const $alerta = $("#alerta");

      // Evitar solo espacios en nombre y mensaje
      $("#nombre, #mensaje").on("input", function () {
        this.setCustomValidity(this.value.trim().length ? "" : " ");
      });

      // Feedback en vivo (verde/rojo)
      $inputs.on("input blur", function () {
        if (this.checkValidity()) {
          $(this).addClass("is-valid").removeClass("is-invalid");
        } else {
          $(this).addClass("is-invalid").removeClass("is-valid");
        }
      });

      // Envío
      $("#form-contacto").on("submit", function (e) {
        // Si es inválido, evita envío y muestra feedback Bootstrap
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
          $(form).addClass("was-validated");

          // marcar clases de cada campo (por si no disparó eventos input/blur)
          $inputs.each(function () {
            $(this).toggleClass("is-invalid", !this.checkValidity());
            $(this).toggleClass("is-valid", this.checkValidity());
          });

          // foco al primero inválido
          const firstInvalid = form.querySelector(":invalid");
          if (firstInvalid) {
            firstInvalid.focus({ preventScroll: true });
            firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          return;
        }

        // Válido → mostrar éxito
        e.preventDefault();
        $alerta.removeClass("d-none").hide().fadeIn();
        setTimeout(() => $alerta.fadeOut(), 2500);

        form.reset();
        $(form).removeClass("was-validated");
        $inputs.removeClass("is-valid is-invalid");
      });
    });
  </script>
</body>
</html>
