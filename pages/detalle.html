<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle de Película</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .badge-genre { margin-right:.35rem; margin-bottom:.35rem; font-size:3rem}
    .rating-stars { font-size:1.05rem; color:#f5c518; } /* estilo tipo IMDb */
    .muted { color:#6c757d; }
    .poster { object-fit:cover; width:100%; height:100%; }
    .card-rounded { border-radius:1rem; overflow:hidden; }
  </style>
</head>
<body>
  <div id="navigation-bar"></div>
  <div class="container py-5">
    <!-- Header -->
    <header class="text-center mb-4">
      <h2 id="titulo" class="mb-2">Cargando…</h2>
      <span id="badge" class="badge text-bg-primary"></span>

      <div class="alert alert-info mt-3" role="alert">
        ¡Disfruta del tráiler oficial y conoce más sobre esta película!
      </div>

      <!-- Tráiler -->
      <div class="ratio ratio-16x9 mb-4">
        <iframe id="trailer" src="" title="Tráiler" allowfullscreen></iframe>
      </div>
    </header>

    <!-- Sinopsis + Poster -->
    <section class="card card-rounded shadow-sm mb-4">
      <div class="row g-0">
        <div class="col-md-4">
          <img id="poster" src="" class="poster" alt="Póster de la película">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5 class="card-title mb-3">Sinopsis</h5>
            <p id="sinopsis" class="card-text text-muted"></p>

            <div class="mb-3">
              <div id="generos" class="d-flex flex-wrap"></div>
            </div>

            <div class="row g-3">
              <div class="col-sm-6">
                <div class="small text-uppercase muted">Fecha de estreno</div>
                <div id="estreno" class="fw-semibold"></div>
              </div>
              <div class="col-sm-6">
                <div class="small text-uppercase muted">Precio</div>
                <div><span class="muted">Estreno:</span> <span id="precio-estreno" class="fw-semibold"></span></div>
                <div><span class="muted">Normal:</span> <span id="precio-normal" class="fw-semibold"></span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Reseñas -->
    <section class="mb-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="h5 m-0">Reseñas</h3>
        <div id="resumen-rating" class="text-end small"></div>
      </div>

      <!-- Spinner reseñas -->
      <div id="spinner-resenas" class="text-center py-4" aria-live="polite">
        <div class="spinner-border" role="status"></div>
        <div class="mt-2 text-muted">Cargando reseñas…</div>
      </div>

      <div id="lista-resenas" class="vstack gap-3"></div>
    </section>

    <div class="text-center">
      <a href="../index.html" class="btn btn-secondary">Volver al inicio</a>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    $("#navigation-bar").load("navBar.html", function(){
          getRutasBarraNavegacion(window.location.pathname);
    });
    $("#footer-placeholder").load("footer.html");

    $(async function () {
        const urlParams = new URLSearchParams(window.location.search);
        const id = Number(urlParams.get("id"));
        const peliculas = await $.getJSON("../data/peliculas.json");

        const peli = peliculas.find(p => { 
          return Number(p.id) === id
        });

        if (peli) {
            $("#badge").text(mensajeBadge(peli))
            $("#titulo").text(peli.titulo);
            $("#poster").attr("src", "../img/" + peli.imagen);
            $("#sinopsis").text(peli.sinopsis);
            $("#genero").text(peli.genero);
            $("#estreno").text(peli.estreno);
            $("#precio-estreno").text(formatearPrecio(peli.precios.estreno));
            $("#precio-normal").text(formatearPrecio(peli.precios.normal));

            const trailerSrc = (peli.trailer || "").includes("embed")
              ? peli.trailer
              : (peli.trailer || "").replace("watch?v=", "embed/");
            $("#trailer").attr("src", trailerSrc);


            cargaResenas(peli.id)
        } else {
            mostrarError();
        }

      });

      async function cargaResenas(id) {
        const $spinner = $("#spinner-resenas");
        const $lista   = $("#lista-resenas");
        const $resumen = $("#resumen-rating");

        $lista.empty().hide();
        $spinner.show();
        $resumen.text("");

        let resenasData;
        try {
          resenasData = await $.getJSON("../data/resenas.json");
        } catch (e) {
          console.error("Error cargando resenas.json", e);
          $spinner.hide();
          $lista.html(`<div class="alert alert-danger">No se pudieron cargar las reseñas. Intenta más tarde.</div>`).show();
          return;
        }

        const entrada = Array.isArray(resenasData)
          ? resenasData.find(x => Number(x.pelicula_id ?? x.peliculaId) === Number(id))
          : null;

        if (!entrada || !Array.isArray(entrada.resenas) || entrada.resenas.length === 0) {
          $spinner.hide();
          $lista.html(`<div class="alert alert-warning">Aún no hay reseñas para esta película.</div>`).show();
          return;
        }

        // Promedio
        const ratings = entrada.resenas.map(r => Number(r.rating) || 0);
        const avg = ratings.reduce((a,b)=>a+b,0) / ratings.length;
        $resumen.text(`Promedio: ${avg.toFixed(1)} / 5 · ${getEstrellas(avg)} · ${entrada.resenas.length} reseña(s)`);

        // Render lista
        const html = entrada.resenas.map(resena => `
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <strong>${resena.autor || "Usuario"}</strong>
                <span class="rating-stars" aria-label="Calificación: ${resena.rating} de 5">${getEstrellas(resena.rating)}</span>
              </div>
              <div class="small text-muted mb-2">${resena.fecha || ""}</div>
              <p class="mb-0">${resena.comentario || ""}</p>
            </div>
          </div>
        `).join("");

        $spinner.hide();
        $lista.html(html).show();
      }

      function mostrarError(msg) {
        $(".container").prepend(`
          <div class="alert alert-danger text-center" role="alert">
            ${msg || "No se pudo cargar la información de la película."}
          </div>
        `);
        $("#titulo").text("Error");
        $("#badge").text("");
        $("#trailer").attr("src", "");
      }

    </script>
  </body>
</html>
